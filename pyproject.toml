[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerpoint-deck-skill"
version = "0.1.0"
description = "Inspect PowerPoint decks and generate slides in the same design system."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
pptx-skill = "powerpoint_deck_skill.cli:main"

[tool.setuptools]
packages = ["powerpoint_deck_skill"]
